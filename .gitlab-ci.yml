# GitLab CI/CD configuration for SQL Code Review
# Configured to run on local runner for AI LLM access
image: python:3.9

stages:
  - precheck
  - database-check
  - sql-review

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Default tags for all jobs to run on local runner
default:
  tags:
    - local-runner
    - ai-review

cache:
  paths:
    - .cache/pip/
    - venv/

# Pre-check job: validates GitLab CI environment variables
precheck-gitlab-env:
  stage: precheck
  image: python:3.9
  script:
    - pip install python-dotenv psycopg2-binary
    - python gitlab_env_check.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Database connectivity check: validates Supabase connection
# This job is allowed to fail - the pipeline will continue with AI-only analysis
precheck-database:
  stage: database-check
  image: python:3.9
  needs: [precheck-gitlab-env]
  script:
    - pip install psycopg2-binary
    - python test_supabase_connection.py
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# SQL Code Review Job - runs regardless of database connectivity
sql-code-review:
  stage: sql-review
  image: python:3.9
  needs: [precheck-gitlab-env]
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - echo "🌟 Attempting to set up cloud database with SQL rules and embeddings..."
    - python resilient_db_setup.py
  script:
    - source venv/bin/activate
    - echo "🔍 Analyzing SQL changes in merge request..."
    - python gitlab_ci_analyzer.py
  artifacts:
    paths:
      - review_results.json
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"