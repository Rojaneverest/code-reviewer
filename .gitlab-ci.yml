# GitLab CI/CD configuration for SQL Code Review
image: python:3.9

stages:
  - precheck
  - test
  - sql-review

# PostgreSQL service for CI environment
services:
  - postgres:13

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # PostgreSQL service configuration
  POSTGRES_DB: rules
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: root
  POSTGRES_HOST_AUTH_METHOD: trust

cache:
  paths:
    - .cache/pip/
    - venv/

# Pre-check job: validates GitLab CI environment variables
precheck-gitlab-env:
  stage: precheck
  image: python:3.9
  script:
    - echo "🔍 Validating GitLab CI/CD environment..."
    - python gitlab_env_check.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# SQL Code Review Job - runs only if precheck passes
sql-code-review:
  stage: sql-review
  image: python:3.9
  services:
    - postgres:13
  needs: [precheck-gitlab-env]
  before_script:
    - apt-get update -qq && apt-get install -y -qq postgresql-client
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
    # Initialize database with SQL rules and vectorization
    - echo "🔧 Setting up PostgreSQL with SQL rules and embeddings..."
    - python setup_ci_database.py
  script:
    - source venv/bin/activate
    - echo "🔍 Analyzing SQL changes in merge request..."
    - python gitlab_ci_analyzer.py
  artifacts:
    paths:
      - review_results.json
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Optional: Local environment test (runs on regular commits)
test-local-env:
  stage: test
  image: python:3.9
  script:
    - pip install python-dotenv
    - python test_env_vars.py
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"