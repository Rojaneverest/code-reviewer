# GitLab CI/CD configuration for SQL Code Review
# Configured to run on local Windows runner with PowerShell
stages:
  - sql-review

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR\\.cache\\pip"
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "utf-8"

# Default tags for all jobs to run on local runner
default:
  tags:
    - ai-code-reviewer

cache:
  paths:
    - .cache/pip/
    - venv/

# SQL Code Review Job - runs with AI-powered analysis
sql-code-review:
  stage: sql-review
  before_script:
    - python -m venv venv
    - .\venv\Scripts\Activate.ps1
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - .\venv\Scripts\Activate.ps1
    - Write-Host "Analyzing SQL changes in merge request..."
    - python gitlab_ci_analyzer.py
  artifacts:
    paths:
      - review_results.json
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"