# Docker Compose setup for GitLab Runner (Alternative to system installation)
version: '3.8'

services:
  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    container_name: gitlab-runner-ai-reviewer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./gitlab-runner-config:/etc/gitlab-runner
      - ./gitlab-runner-data:/home/gitlab-runner
    network_mode: host
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    # Uncomment the following lines if you need to run as a specific user
    # user: "1000:1000"  # Replace with your user:group ID
    
    # Environment variables file (create this file with your secrets)
    env_file:
      - .env.runner  # Create this file with your environment variables

# To use this setup:
# 1. Create .env.runner file with your environment variables
# 2. Run: docker-compose up -d
# 3. Register the runner: docker-compose exec gitlab-runner gitlab-runner register
# 4. Configure with the same settings as described in local-runner-setup.md
